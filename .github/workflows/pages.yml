name: Check GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify website and app files
        run: |
          base="https://riannesplinter.github.io/De-stalkas"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "$base/" -o /tmp/stalkas.html
          grep -q 'De StalKas' /tmp/stalkas.html
          for file in manifest.webmanifest sw.js icons/icon-180.png icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 3 --max-time 20 "$base/$file" -o /dev/null
          done
          echo "Website, manifest, service worker and all icons are publicly reachable."
