name: Enable GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Publish main from repository root
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$REPOSITORY/pages" > /dev/null 2>&1; then
            gh api --method PUT "repos/$REPOSITORY/pages" -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/'
          else
            gh api --method POST "repos/$REPOSITORY/pages" -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/'
          fi
          gh api --method POST "repos/$REPOSITORY/pages/builds"
